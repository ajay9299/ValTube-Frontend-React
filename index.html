<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ValTube Frontend</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      :root {
        --bg: #f7f8fb;
        --text: #0f172a;
      }
      body {
        font-family:
          Inter,
          Roboto,
          system-ui,
          -apple-system,
          "Segoe UI";
        background: var(--bg);
        color: var(--text);
      }
      .app-root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 16px 24px;
        border-bottom: 1px solid #e5e7eb;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      nav {
        display: flex;
        gap: 16px;
      }
      nav a,
      nav button {
        text-decoration: none;
        color: var(--text);
        background: none;
        border: none;
        cursor: pointer;
        padding: 8px 12px;
        border-radius: 6px;
      }
      nav a:hover,
      nav button:hover {
        background: #e5e7eb;
      }
      main {
        flex: 1;
        padding: 24px;
      }
      footer {
        padding: 24px;
        border-top: 1px solid #e5e7eb;
        text-align: center;
      }
      form {
        max-width: 480px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      input {
        padding: 8px;
        border-radius: 6px;
        border: 1px solid #ccc;
        width: 100%;
      }
      button {
        padding: 8px 12px;
        border-radius: 6px;
        border: 1px solid #ccc;
        background: #fff;
        cursor: pointer;
      }
      button:hover {
        background: #f0f0f0;
      }
      .error {
        color: red;
      }
      .success {
        color: green;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      const API_BASE = "http://localhost:4000/api";
      const app = {
        user: JSON.parse(localStorage.getItem("user") || "null"),
        token: localStorage.getItem("token"),

        async login(email, password) {
          try {
            const res = await fetch(`${API_BASE}/auth/login`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ email, password }),
            });
            const data = await res.json();
            if (data.token) {
              localStorage.setItem("token", data.token);
              localStorage.setItem("user", JSON.stringify(data.user || {}));
              this.token = data.token;
              this.user = data.user;
              this.render();
            } else {
              alert("Login failed");
            }
          } catch (e) {
            alert("Error: " + e.message);
          }
        },

        logout() {
          localStorage.removeItem("token");
          localStorage.removeItem("user");
          this.user = null;
          this.token = null;
          this.render();
        },

        render() {
          const root = document.getElementById("root");
          root.innerHTML = `
            <div class="app-root">
              <header>
                <div><a href="#" onclick="app.renderHome()">ValTube</a></div>
                <nav>
                  ${
                    this.user
                      ? `
                    <a href="#" onclick="app.renderDashboard()">Dashboard</a>
                    <button onclick="app.logout()">Logout</button>
                  `
                      : `
                    <a href="#" onclick="app.renderLogin()">Login</a>
                    <a href="#" onclick="app.renderRegister()">Register</a>
                  `
                  }
                </nav>
              </header>
              <main id="content"></main>
              <footer><small>© 2026 ValTube</small></footer>
            </div>
          `;
          this.renderHome();
        },

        renderHome() {
          document.getElementById("content").innerHTML = `
            <div>
              <h1>Welcome to ValTube</h1>
              <p>This is the landing page.</p>
              ${!this.user ? '<a href="#" onclick="app.renderLogin()">Login</a>' : ""}
            </div>
          `;
        },

        renderLogin() {
          document.getElementById("content").innerHTML = `
            <form onsubmit="event.preventDefault(); app.login(document.getElementById('email').value, document.getElementById('password').value)">
              <h2>Login</h2>
              <label>Email</label>
              <input id="email" type="email" placeholder="Email" required />
              <label>Password</label>
              <input id="password" type="password" placeholder="Password" required />
              <button type="submit">Login</button>
              <button type="button" onclick="app.renderRegister()">Create an account</button>
            </form>
          `;
        },

        renderRegister() {
          document.getElementById("content").innerHTML = `
            <form onsubmit="event.preventDefault(); alert('Register: Connect your backend API')">
              <h2>Register</h2>
              <label>Email</label>
              <input type="email" placeholder="Email" required />
              <label>Password</label>
              <input type="password" placeholder="Password" required />
              <button type="submit">Register</button>
              <button type="button" onclick="app.renderLogin()">Back to login</button>
            </form>
          `;
        },

        renderDashboard() {
          document.getElementById("content").innerHTML = `
            <div>
              <h1>Dashboard</h1>
              <pre>${JSON.stringify(this.user, null, 2)}</pre>
              <button onclick="app.logout()">Logout</button>
            </div>
          `;
        },
      };

      app.render();
    </script>
  </body>
</html>
